<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oreal Beauty Advisor</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <header class="site-header">
        <img src="img/loreal-logo.png" alt="L'Oreal Logo" class="logo" />

        <h1 class="site-title">L’Oréal Beauty Advisor</h1>

        <p class="subtitle">
          Personalized skincare, makeup, haircare, fragrance, and beauty routine
          recommendations.
        </p>
      </header>

      <main>
        <section class="current-question">
          <h2>Your Latest Question</h2>

          <p id="latestQuestion">Ask a beauty question to begin.</p>
        </section>

        <section class="chatbox">
          <div id="chatWindow" class="chat-window"></div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">
              Enter Message
            </label>

            <input
              type="text"
              id="userInput"
              name="userInput"
              placeholder="Ask about skincare, makeup, haircare, fragrances..."
              autocomplete="off"
              required
            />

            <button type="submit">
              <span class="material-icons"> send </span>

              <span class="visually-hidden"> Send </span>
            </button>
          </form>
        </section>
      </main>

      <footer class="site-footer">
        <p>
          This chatbot was created for educational purposes and is not
          affiliated with or endorsed by L'Oréal.
        </p>

        <nav>
          <a href="https://www.loreal.com/en/" target="_blank"> L'Oréal </a>

          <a
            href="https://www.loreal.com/en/group/privacy-policy/"
            target="_blank"
          >
            Privacy
          </a>

          <a
            href="https://www.loreal.com/en/group/terms-of-use/"
            target="_blank"
          >
            Terms
          </a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
